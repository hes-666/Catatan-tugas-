<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Tugas Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 
<link rel="stylesheet" href="style.css">
</head>
 
<!-- ===================== HTML ===================== -->
<body>
<main class="wrap">
  <header class="head">
    <h1>Tugas saya</h1>
    <p class="today" id="today"></p>
    <p class="summary" id="summary"></p>
  </header>
 
  <form id="taskForm" novalidate>
    <div class="composer">
      <p class="edit-banner" id="editBanner" hidden>Mengubah tugas</p>
      <input type="text" id="title" maxlength="120" placeholder="Tulis tugas baru" aria-label="Nama tugas" autocomplete="off">
      <input type="text" id="note" maxlength="300" placeholder="Tambahkan catatan (opsional)" aria-label="Catatan" autocomplete="off">
      <div class="foot">
        <input type="datetime-local" id="due" aria-label="Tenggat waktu">
        <select id="priority" aria-label="Prioritas">
          <option value="rendah">Prioritas rendah</option>
          <option value="sedang" selected>Prioritas sedang</option>
          <option value="tinggi">Prioritas tinggi</option>
        </select>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="cancelBtn" hidden>Batal</button>
        <button type="submit" class="btn" id="submitBtn">Tambah</button>
      </div>
    </div>
    <p class="form-error" id="formError" role="alert"></p>
  </form>
 
  <div class="tabs" role="group" aria-label="Filter tugas">
    <button type="button" class="tab" id="tabPending" aria-pressed="true">Belum dikerjakan<span class="n" id="nPending">0</span></button>
    <button type="button" class="tab" id="tabDone" aria-pressed="false">Selesai<span class="n" id="nDone">0</span></button>
  </div>
 
  <div id="content"></div>
</main>
 
<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastMsg"></span>
  <button type="button" id="toastAction"></button>
</div>
 
<script src="script.js"></script>
</body>
</html>
